databases:
  - name: roommate-os-db
    databaseName: roommate_os
    plan: free

services:
  - type: web
    name: roommate-os
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roommate-os-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2